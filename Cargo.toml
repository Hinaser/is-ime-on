[package]
name = "is-ime-on"
version = "0.1.0"
edition = "2024"
# as_chunks(1.88安定化)を使用
rust-version = "1.88"
description = "IME-linked text caret indicator for Windows"
license = "MIT"
repository = "https://github.com/Hinaser/is-ime-on"
authors = ["Hinaser"]

[[bin]]
name = "IsImeOn"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-numerics = "0.2"
raw-window-handle = "0.6"
# eframe 0.31 の wgpu は dx12 機能を有効にしない(metal/webgpu のみ)。
# そのままだと Windows では Vulkan、無ければ GL(=元凶のバックエンド)に落ちるため、
# 機能統合で dx12 を足す。バックエンドの選択は settings.rs 側で DX12 を明示する。
wgpu = { version = "24", default-features = false, features = ["dx12"] }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
